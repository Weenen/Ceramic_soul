<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Website for Ceramic soul brand" />
	<meta name="author" content="Awesome student" />
	<title>Ceramic soul</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;1,400&display=swap"
		rel="stylesheet" />
</head>

<body>
	<header>
		<div class="container">
			<section class="header">
				<img src="/src/img/promo/potter.jpg" alt="potter" class="header__img">
				<div class="header__top">
					<div class="burger"><span></span><span></span><span></span></div>
					<a href="#" class="header__logo"><img src="/src/logo/logo.png" alt="logo"></a>
					<div class="header__icons">
						<a href="#"><span class="icon-search"></span></a>
						<a href="#"><span class="icon-shopping-bag"></span></a>
					</div>
				</div>
				<nav class="header__nav">
					<ul>
						<li><a href="#" class="header__nav-link">catalog</a></li>
						<li><a href="#" class="header__nav-link">blog</a></li>
						<li><a href="#" class="header__nav-link">about</a></li>
					</ul>
				</nav>
			</section>
		</div>
	</header>
	<main>
		<section class="promo">
			<div class="container">
				<div class="promo__wrapper">
					<h1 class="promo__wrapper-title title-h1-italic">Make your dream come true <br>
						or decorate your home</h1>
					<div class="promo__wrapper-cta">
						<img src="/src/img/promo/ceramic-vase.jpg" alt="vase" class="cta-img">
						<a href="#" class="cta-btn btn-shop">shop now</a>
					</div>
				</div>
			</div>
		</section>
	</main>
	<script type="module" src="/src/js/script.js"></script>
</body>

</html>
